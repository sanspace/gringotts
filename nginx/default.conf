# nginx/default.conf

server {
    # Listen on the port Cloud Run provides, default is 8080
    listen 80;

    # Define the root directory where React files are copied
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Serve static files directly
    location / {
        # First attempt to serve request as file ($uri), 
        # then as directory ($uri/), 
        # then fall back to displaying /index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Add caching headers for static assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public";
    }

    # Optional: Disable access logs for health checks if needed
    # location = /healthz {
    #   access_log off;
    #   # Add health check logic if necessary, e.g., return 200;
    # }
}
